name: Generate Next security upgrade

on:
  push:
    branches:
      - fix/next-security-upgrade

permissions:
  contents: write

jobs:
  generate-and-validate:
    if: github.event.head_commit.message == 'Prepare Next security upgrade generation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current exact tree
        run: npm ci
      - name: Generate patched dependency tree
        run: npm install --save-exact next@16.3.4 eslint-config-next@16.3.4
      - name: Require clean runtime audit
        run: |
          npm audit --omit=dev --json > audit-runtime.json || true
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('audit-runtime.json', 'utf8'));
          const v = data.metadata?.vulnerabilities ?? {};
          console.log('runtime audit', JSON.stringify(v));
          for (const [name, item] of Object.entries(data.vulnerabilities ?? {})) {
            console.log(JSON.stringify({name, severity:item.severity, range:item.range, fixAvailable:item.fixAvailable}));
          }
          if ((v.high ?? 0) > 0 || (v.critical ?? 0) > 0) process.exit(1);
          NODE
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Validate vinext build
        run: npm run build:vinext
      - name: Commit generated package files
        run: |
          git config user.name optimisticjp
          git config user.email optimistic.jp@gmail.com
          git add package.json package-lock.json
          git commit -m 'Upgrade Next.js security patch set'
          git push origin HEAD:fix/next-security-upgrade
