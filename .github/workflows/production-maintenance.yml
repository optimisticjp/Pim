name: Production maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  database-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_BACKUP_URL: ${{ secrets.SUPABASE_DB_BACKUP_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Check backup configuration
        id: config
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_DB_BACKUP_URL R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BACKUP_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not configured; database backup will be skipped."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install backup tools
        if: steps.config.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client awscli

      - name: Create and verify logical backup
        if: steps.config.outputs.ready == 'true'
        id: dump
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p backup
          dump="backup/database.dump"
          pg_dump "$SUPABASE_DB_BACKUP_URL" --format=custom --no-owner --no-privileges --file="$dump"
          pg_restore --list "$dump" >/dev/null
          sha256sum "$dump" > backup/database.dump.sha256
          {
            echo "created_utc=$stamp"
            echo "git_sha=$GITHUB_SHA"
            echo "format=postgres-custom"
            echo "checksum_sha256=$(cut -d' ' -f1 backup/database.dump.sha256)"
          } > backup/manifest.txt
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      - name: Upload and prune R2 backup tiers
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          STAMP: ${{ steps.dump.outputs.stamp }}
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          upload_tier() {
            tier="$1"
            prefix="backups/${tier}/${STAMP}"
            aws --endpoint-url "$endpoint" s3 cp backup/database.dump "s3://${R2_BACKUP_BUCKET}/${prefix}/database.dump" --only-show-errors
            aws --endpoint-url "$endpoint" s3 cp backup/database.dump.sha256 "s3://${R2_BACKUP_BUCKET}/${prefix}/database.dump.sha256" --only-show-errors
            aws --endpoint-url "$endpoint" s3 cp backup/manifest.txt "s3://${R2_BACKUP_BUCKET}/${prefix}/manifest.txt" --only-show-errors
          }
          prune_tier() {
            tier="$1"; keep="$2"
            prefixes="$(aws --endpoint-url "$endpoint" s3api list-objects-v2 --bucket "$R2_BACKUP_BUCKET" --prefix "backups/${tier}/" --delimiter "/" --query 'CommonPrefixes[].Prefix' --output text || true)"
            printf '%s\n' "$prefixes" | tr '\t' '\n' | grep "^backups/${tier}/" | sort -r | tail -n "+$((keep+1))" | while read -r prefix; do
              [ -n "$prefix" ] || continue
              aws --endpoint-url "$endpoint" s3 rm "s3://${R2_BACKUP_BUCKET}/${prefix}" --recursive --only-show-errors
            done || true
          }

          upload_tier daily
          if [ "$(date -u +%u)" = "7" ]; then upload_tier weekly; fi
          if [ "$(date -u +%d)" = "01" ]; then upload_tier monthly; fi
          prune_tier daily 7
          prune_tier weekly 4
          prune_tier monthly 6

  private-document-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPS_MAINTENANCE_TOKEN: ${{ secrets.OPS_MAINTENANCE_TOKEN }}
    steps:
      - name: Run private document retention cleanup
        shell: bash
        run: |
          if [ -z "$OPS_MAINTENANCE_TOKEN" ]; then
            echo "::warning::OPS_MAINTENANCE_TOKEN is not configured; document cleanup will be skipped."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "x-ops-maintenance-token: $OPS_MAINTENANCE_TOKEN" \
            "https://vknvvuyamyyyskbsmfpb.supabase.co/functions/v1/cleanup-booking-documents" >/dev/null
