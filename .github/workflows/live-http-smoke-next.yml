name: Live HTTP smoke after Next upgrade

on:
  push:
    branches:
      - chore/live-http-smoke-next

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Smoke production routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://pim.essanciaonline.workers.dev'
          html_routes=(
            '/'
            '/ashrams'
            '/events'
            '/programmes'
            '/seva'
            '/activities'
            '/parampara'
            '/heritage'
            '/heritage/letters'
            '/heritage/gallery'
            '/satsang'
            '/downloads'
            '/publications'
            '/veda-rahasya'
            '/forms'
            '/contact'
            '/participation'
            '/membership'
            '/volunteer'
            '/stay'
            '/donation'
            '/veda-rahasya/membership'
            '/veda-rahasya/services'
            '/admin/login'
          )
          failures=0
          for route in "${html_routes[@]}"; do
            body=$(mktemp)
            meta=$(curl -sS -L --max-time 30 -o "$body" -w '%{http_code}|%{url_effective}|%{content_type}|%{size_download}' "$base$route") || {
              echo "FAIL $route curl-error"
              failures=$((failures+1))
              rm -f "$body"
              continue
            }
            IFS='|' read -r code effective content_type size <<< "$meta"
            echo "$route -> $meta"
            if [[ "$code" != '200' || "$content_type" != text/html* || "$size" -lt 1000 ]]; then
              echo "FAIL $route bad-html-response"
              failures=$((failures+1))
            fi
            if ! head -c 500 "$body" | grep -Eqi '<!doctype html|<html'; then
              echo "FAIL $route missing-html-document"
              failures=$((failures+1))
            fi
            rm -f "$body"
          done

          events=$(mktemp)
          events_meta=$(curl -sS -L --max-time 30 -o "$events" -w '%{http_code}|%{content_type}|%{size_download}' "$base/api/events") || true
          echo "/api/events -> $events_meta"
          IFS='|' read -r events_code events_type events_size <<< "$events_meta"
          if [[ "$events_code" != '200' || "$events_type" != application/json* ]]; then
            echo 'FAIL /api/events bad-response'
            failures=$((failures+1))
          elif ! node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$events"; then
            echo 'FAIL /api/events invalid-json'
            failures=$((failures+1))
          fi
          rm -f "$events"

          sitemap=$(mktemp)
          sitemap_meta=$(curl -sS -L --max-time 30 -o "$sitemap" -w '%{http_code}|%{content_type}|%{size_download}' "$base/sitemap.xml") || true
          echo "/sitemap.xml -> $sitemap_meta"
          IFS='|' read -r sitemap_code sitemap_type sitemap_size <<< "$sitemap_meta"
          if [[ "$sitemap_code" != '200' || "$sitemap_type" != application/xml* || "$sitemap_size" -lt 100 ]]; then
            echo 'FAIL /sitemap.xml bad-response'
            failures=$((failures+1))
          elif ! grep -q '<urlset' "$sitemap"; then
            echo 'FAIL /sitemap.xml invalid-sitemap'
            failures=$((failures+1))
          fi
          rm -f "$sitemap"

          echo "failures=$failures"
          test "$failures" -eq 0
