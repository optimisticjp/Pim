name: Fix Supabase Auth redirect

on:
  push:
    branches:
      - chore/fix-supabase-auth-redirect

permissions:
  contents: read

jobs:
  fix-auth-redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: vknvvuyamyyyskbsmfpb
      SITE_URL: https://pim.essanciaonline.workers.dev
      SETUP_URL: https://pim.essanciaonline.workers.dev/admin/setup
    steps:
      - name: Check management token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured in this repository."
            exit 2
          fi
          echo "Supabase management token is configured."

      - name: Read, patch, and verify Auth URL configuration
        shell: bash
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          endpoint="https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"

          curl --fail-with-body --silent --show-error \
            -H "$auth_header" \
            -H "Content-Type: application/json" \
            "$endpoint" > /tmp/auth-before.json

          python3 - <<'PY'
          import json, os
          cfg=json.load(open("/tmp/auth-before.json"))
          raw=(cfg.get("uri_allow_list") or "").strip()
          urls=[u.strip() for u in raw.split(",") if u.strip()]
          for u in (os.environ["SITE_URL"], os.environ["SETUP_URL"]):
              if u not in urls:
                  urls.append(u)
          patch={
              "site_url": os.environ["SITE_URL"],
              "uri_allow_list": ",".join(urls),
          }
          json.dump(patch, open("/tmp/auth-patch.json","w"))
          print("before_site_url=" + str(cfg.get("site_url")))
          print("before_uri_allow_list=" + raw)
          print("target_site_url=" + patch["site_url"])
          print("target_uri_allow_list=" + patch["uri_allow_list"])
          PY

          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "$auth_header" \
            -H "Content-Type: application/json" \
            --data @/tmp/auth-patch.json \
            "$endpoint" > /tmp/auth-patched.json

          curl --fail-with-body --silent --show-error \
            -H "$auth_header" \
            -H "Content-Type: application/json" \
            "$endpoint" > /tmp/auth-after.json

          python3 - <<'PY'
          import json, os
          cfg=json.load(open("/tmp/auth-after.json"))
          site=cfg.get("site_url")
          raw=(cfg.get("uri_allow_list") or "")
          urls=[u.strip() for u in raw.split(",") if u.strip()]
          print("after_site_url=" + str(site))
          print("after_uri_allow_list=" + raw)
          assert site == os.environ["SITE_URL"], (site, os.environ["SITE_URL"])
          assert os.environ["SETUP_URL"] in urls, urls
          print("Auth redirect configuration verified.")
          PY
